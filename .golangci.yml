# Lint configuration of the Go tech matrix (tech-matrix-go.md § Lint configuration), as is.
version: "2"
linters:
  default: standard
  enable: [funlen, gocognit, gosec, revive]
  settings:
    funlen: {lines: 40, statements: -1, ignore-comments: true}
    gocognit: {min-complexity: 15}
    revive:
      rules:
        - {name: argument-limit, arguments: [5]}
        - {name: max-control-nesting, arguments: [4]}
        - {name: file-length-limit, arguments: [{max: 300, skipComments: true, skipBlankLines: true}]}
