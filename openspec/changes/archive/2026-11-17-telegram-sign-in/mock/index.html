main{max-width:1800px;margin:0 auto}
h1{font-size:24px;margin:0 0 4px}h2{font-size:18px;margin:30px 0 8px}h3{font-size:16px;margin:20px 0 6px}
.sub{color:var(--mut);font-size:14px;font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin:10px 0}
.verdict{font-size:22px;font-weight:700;border-width:2px}
.v-new{border-color:var(--new);background:var(--newbg)}.v-rem,.v-err{border-color:var(--rem);background:var(--rembg)}

.v-old{border-color:var(--old);background:var(--oldbg)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:900px){.pair{grid-template-columns:1fr}}
figure{margin:10px 0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto}
figcaption{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.pair figure:last-child figcaption{color:var(--newt)}
.note{margin:6px 2px 0;color:var(--mut);font-size:14px}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.legend span::before{content:"";display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px;border:1.5px solid var(--k);background:var(--kb)}
.l-new{--k:var(--new);--kb:var(--newbg)}.l-chg{--k:var(--chg);--kb:var(--chgbg)}.l-rem{--k:var(--rem);--kb:var(--rembg)}
.l-old{--k:var(--old);--kb:var(--oldbg)}.l-focus{--k:var(--focus);--kb:var(--focusbg)}.l-err{--k:var(--err);--kb:var(--errbg)}
.l-client{--k:var(--client);--kb:var(--clientbg)}.l-svc{--k:var(--svc);--kb:var(--svcbg)}
.l-store{--k:var(--store);--kb:var(--storebg)}.l-ext{--k:var(--ext);--kb:var(--extbg)}
.legend span.l-line::before{content:none}.l-line svg{vertical-align:middle;margin-right:6px}
.verdict .chips{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;font-size:13px}
.c-new{color:var(--newt);background:var(--newbg)}.c-chg{color:var(--chgt);background:var(--chgbg)}.c-rem{color:var(--remt);background:var(--rembg)}.c-old{color:var(--oldt);background:var(--oldbg)}.c-focus{color:var(--focust);background:var(--focusbg)}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:14px}
code{font:14px ui-monospace,Menlo,monospace;background:color-mix(in srgb,var(--line) 50%,transparent);padding:1px 5px;border-radius:4px}
.chip{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.ok{color:var(--newt);background:var(--newbg)}.warn{color:var(--chgt);background:var(--chgbg)}.fail{color:var(--remt);background:var(--rembg)}
pre{font:13px/1.4 ui-monospace,Menlo,monospace;background:color-mix(in srgb,var(--line) 40%,transparent);padding:10px 12px;border-radius:8px;overflow:auto}
.kit-render svg{max-width:100%;height:auto}
nav.toc{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}
a{color:var(--focust)}
